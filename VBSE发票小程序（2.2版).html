<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>VBSE 电子发票小程序</title>
<style>
:root {
    --ink: #1f2328;
    --muted: #64748b;
    --line: #8e1e18;
    --paper: #fffdf8;
    --panel: #ffffff;
    --primary: #165dff;
    --green: #13795b;
    --danger: #b42318;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, rgba(255,255,255,0.76), rgba(238,242,246,0.94)), #eef2f6;
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}

.app {
    width: min(1680px, calc(100% - 24px));
    margin: 0 auto;
    padding: 24px 0 40px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.86);
    border: 1px solid #dbe3ee;
    border-radius: 8px;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
}

.title {
    margin: 0;
    font-size: 24px;
    line-height: 1.25;
}

.topbar-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.teaching-badge {
    display: inline-block;
    padding: 6px 12px;
    border: 2px solid #b42318;
    border-radius: 6px;
    color: #b42318;
    background: #fff5f4;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
}

.layout {
    display: grid;
    grid-template-columns: minmax(620px, 720px) minmax(520px, 1fr);
    gap: 14px;
    align-items: start;
}

.panel {
    background: var(--panel);
    border: 1px solid #dbe3ee;
    border-radius: 8px;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
}

.form-panel { padding: 16px 18px; }

.section {
    padding: 16px 0;
    border-top: 1px solid #e6edf5;
}

.section:first-child {
    padding-top: 0;
    border-top: 0;
}

.section h2 {
    margin: 0 0 12px;
    font-size: 15px;
    color: #16233a;
    display: flex;
    align-items: center;
    gap: 8px;
}

.section h2::before {
    content: "";
    width: 4px;
    height: 16px;
    border-radius: 99px;
    background: var(--primary);
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field.full { grid-column: 1 / -1; }

label {
    color: #475569;
    font-size: 13px;
    font-weight: 600;
}

input,
select,
textarea {
    width: 100%;
    min-height: 40px;
    border: 1px solid #cfd8e5;
    border-radius: 6px;
    background: #fcfdff;
    color: #111827;
    padding: 8px 10px;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 76px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.12);
}

.line-editor {
    border: 1px solid #d9e2ec;
    border-radius: 8px;
    overflow: hidden;
}

.line-head,
.line-row {
    display: grid;
    grid-template-columns: minmax(120px, 1fr) 48px 56px 72px 118px 78px 78px 38px;
    gap: 6px;
    align-items: center;
}

.line-head > *,
.line-row > * {
    min-width: 0;
}

.line-head {
    background: #f7f9fc;
    color: #506176;
    padding: 8px;
    font-size: 12px;
    font-weight: 700;
}

.line-row {
    position: relative;
    padding: 8px;
    border-top: 1px solid #e6edf5;
    background: #fff;
}

.line-row input,
.line-row select {
    width: 100%;
    min-width: 0;
    min-height: 34px;
    padding: 6px 8px;
    font-size: 13px;
}

.tax-cell {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 6px;
}

.tax-cell.manual-mode {
    grid-template-columns: minmax(56px, 1fr) 54px;
}

.tax-manual {
    padding-left: 4px;
    padding-right: 4px;
    text-align: center;
}

.tax-manual[hidden] { display: none; }

.line-money {
    min-width: 0;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 8px;
    border: 1px solid #e4e8ef;
    border-radius: 6px;
    background: #f8fafc;
    color: #334155;
    font: 700 12px "Microsoft YaHei", sans-serif;
    overflow: hidden;
}

.line-delete {
    position: static;
    min-height: 34px;
    height: 34px;
    width: 38px;
    border: 1px solid #e4e8ef;
    border-radius: 6px;
    color: var(--danger);
    background: #fff5f5;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    padding: 0;
    box-shadow: none;
}

.line-delete:hover {
    background: #ffe4e4;
    box-shadow: none;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
}

button {
    min-height: 42px;
    border: 0;
    border-radius: 6px;
    padding: 0 16px;
    color: #fff;
    background: var(--primary);
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
}

button.secondary {
    color: #17324d;
    background: #e8eef7;
}

button.print { background: var(--green); }
button.ghost { color: var(--primary); background: #eef4ff; }
button.danger { color: var(--danger); background: #fff1f0; }

.preview-panel {
    padding: 16px;
    overflow-x: hidden;
}

.invoice-stage {
    --invoice-scale: 1;
    width: 100%;
    min-height: calc(760px * var(--invoice-scale));
}

.invoice {
    position: relative;
    width: 1180px;
    min-height: 760px;
    margin: 0;
    padding: 28px 26px 20px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid rgba(142, 30, 24, 0.25);
    font-family: "SimSun", "FangSong", serif;
    box-shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
    transform: scale(var(--invoice-scale));
    transform-origin: top left;
}

.invoice::before {
    content: "实训样票";
    position: absolute;
    inset: 270px auto auto 390px;
    z-index: 0;
    color: rgba(142, 30, 24, 0.055);
    font: 700 96px "SimHei", sans-serif;
    letter-spacing: 28px;
    transform: rotate(-18deg);
    pointer-events: none;
}

.invoice > * {
    position: relative;
    z-index: 1;
}

.invoice-header {
    display: grid;
    grid-template-columns: 180px 1fr 290px;
    align-items: start;
    gap: 24px;
    min-height: 150px;
}

.qr {
    width: 126px;
    height: 126px;
    padding: 6px;
    background: #fff;
    border: 2px solid #111;
}

.qr canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
}

.invoice-title {
    text-align: center;
    color: var(--line);
    padding-top: 18px;
}

.invoice-title h1 {
    margin: 0 0 12px;
    font: 400 34px "KaiTi", "STKaiti", "SimSun", serif;
    letter-spacing: 10px;
}

.title-rule {
    width: 420px;
    margin: 0 auto;
    border-top: 3px double var(--line);
}

.seal {
    position: absolute;
    top: 38px;
    left: 50%;
    width: 176px;
    height: 100px;
    transform: translateX(-50%) rotate(-8deg);
    border: 5px double #d33127;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #d33127;
    font: 700 16px "KaiTi", serif;
    opacity: 0.88;
}

.seal small {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    letter-spacing: 4px;
}

.meta {
    padding-top: 42px;
    color: var(--line);
    font: 700 18px "FangSong", serif;
}

.meta div { margin-bottom: 22px; }

.meta span {
    color: var(--ink);
    font: 400 20px "Times New Roman", "SimSun", serif;
    letter-spacing: 1px;
}

.invoice-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    border: 2px solid var(--line);
}

.invoice-table td,
.invoice-table th {
    border: 1px solid var(--line);
    vertical-align: top;
}

.party-label,
.remark-label {
    width: 36px;
    color: var(--line);
    text-align: center;
    font: 700 21px/1.5 "FangSong", serif;
    letter-spacing: 3px;
    padding: 18px 6px;
}

.party-box {
    height: 126px;
    padding: 22px 16px;
    font-size: 20px;
    line-height: 2.05;
}

.party-box .caption {
    color: var(--line);
    font-weight: 700;
}

.party-box .tax-id {
    font-size: 20px;
    letter-spacing: 4px;
}

.goods-table { margin-top: -1px; }

.goods-table th {
    height: 44px;
    color: var(--line);
    font: 700 18px "FangSong", serif;
    text-align: center;
    vertical-align: middle;
    background: transparent;
}

.goods-table td {
    height: 35px;
    padding: 4px 8px;
    font: 400 19px "SimSun", serif;
    border-left: 0;
    border-right: 0;
    border-top: 0;
    border-bottom: 0;
}

.goods-table .num {
    text-align: right;
    font-family: "Times New Roman", "SimSun", serif;
}

.goods-table .line-total td {
    height: 48px;
    border-top: 1px solid var(--line);
    vertical-align: middle;
}

.amount-row td {
    height: 48px;
    padding: 8px 14px;
    font-size: 21px;
    vertical-align: middle;
}

.amount-label {
    width: 300px;
    color: var(--line);
    text-align: center;
    font-weight: 700;
    letter-spacing: 8px;
}

.amount-small {
    width: 330px;
    color: var(--line);
    text-align: center;
    font-weight: 700;
}

.remark-row td { height: 116px; }

.remark-content {
    padding: 8px 12px;
    white-space: pre-wrap;
    font-size: 18px;
    line-height: 1.7;
}

.footer {
    display: flex;
    gap: 72px;
    margin-top: 22px;
    padding-left: 90px;
    font: 400 18px "SimSun", serif;
}

.history {
    margin-top: 18px;
    padding: 16px;
}

.history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.history h2 {
    margin: 0;
    font-size: 17px;
}

.history-list {
    display: grid;
    gap: 10px;
}

.history-empty {
    padding: 16px;
    border: 1px dashed #cbd5e1;
    color: var(--muted);
    text-align: center;
    border-radius: 6px;
}

.history-card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    border: 1px solid #e0e7ef;
    border-radius: 8px;
    padding: 12px;
    background: #fbfdff;
}

.history-main strong {
    display: block;
    margin-bottom: 5px;
}

.history-main span {
    display: inline-block;
    margin-right: 12px;
    color: #526173;
    font-size: 13px;
}

.history-actions {
    display: flex;
    gap: 8px;
    align-items: center;
}

/* 单条删除按钮仅桌面版显示（deleteHistory 函数两端都在，网页版不出现入口） */
.history-delete {
    display: none;
}

/* 导出/导入按钮仅桌面版显示（exportInvoice/importInvoice 函数两端可运行，网页版不出现入口） */
.io-btn {
    display: none;
}

.toast {
    min-height: 22px;
    margin-top: 10px;
    color: var(--green);
    font-size: 13px;
}

@media (max-width: 1180px) {
    .layout { grid-template-columns: 1fr; }
}

@media (max-width: 1320px) and (min-width: 1181px) {
    .layout { grid-template-columns: minmax(600px, 680px) minmax(420px, 1fr); }
}

@media (max-width: 680px) {
    .app {
        width: min(100% - 20px, 1480px);
        padding-top: 14px;
    }

    .topbar,
    .history-card { display: block; }

    .grid,
    .line-row { grid-template-columns: 1fr; }

    .line-head { display: none; }

    .tax-cell { grid-template-columns: 1fr; }

    .line-row > *::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 4px;
        color: #64748b;
        font-size: 12px;
        font-weight: 700;
    }

    .history-actions {
        margin-top: 10px;
        flex-wrap: wrap;
    }
}

@media print {
    @page { size: A4 landscape; margin: 6mm; }

    * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    body {
        background: #fff;
        margin: 0;
    }

    .app {
        width: 1060px;
        padding: 0;
        margin: 0;
    }

    .topbar,
    .form-panel,
    .history { display: none !important; }

    .layout,
    .preview-panel {
        display: block;
        padding: 0;
        border: 0;
        box-shadow: none;
        overflow: visible;
        width: 1060px;
    }

    .invoice-stage {
        width: 1060px;
        min-height: 0 !important;
    }

    .invoice {
        width: 1060px;
        min-height: 0;
        padding: 12px 14px 8px;
        margin: 0;
        box-shadow: none;
        border: 0;
        transform: none !important;
        transform-origin: top left;
        page-break-inside: avoid;
        break-inside: avoid;
    }

    .invoice::before {
        inset: 218px auto auto 340px;
        font-size: 68px;
    }

    .invoice-header {
        grid-template-columns: 132px 1fr 246px;
        gap: 14px;
        min-height: 104px;
    }

    .qr {
        width: 82px;
        height: 82px;
        padding: 4px;
    }

    .invoice-title { padding-top: 6px; }

    .invoice-title h1 {
        font-size: 27px;
        letter-spacing: 8px;
        margin-bottom: 8px;
    }

    .title-rule { width: 360px; }

    .seal {
        top: 25px;
        width: 132px;
        height: 72px;
        font-size: 12px;
    }

    .meta {
        padding-top: 22px;
        font-size: 15px;
    }

    .meta div { margin-bottom: 13px; }
    .meta span { font-size: 16px; }

    .party-label,
    .remark-label {
        width: 30px;
        font-size: 16px;
        padding: 8px 4px;
    }

    .party-box {
        height: 92px;
        padding: 11px 12px;
        font-size: 16px;
        line-height: 1.75;
    }

    .party-box .tax-id {
        font-size: 16px;
        letter-spacing: 3px;
    }

    .goods-table th {
        height: 28px;
        font-size: 14px;
        padding: 2px 4px;
    }

    .goods-table td {
        height: 24px;
        padding: 2px 5px;
        font-size: 14px;
    }

    .goods-table .line-total td { height: 30px; }

    .goods-table th:nth-child(1) { width: 230px !important; }
    .goods-table th:nth-child(2) { width: 76px !important; }
    .goods-table th:nth-child(3) { width: 90px !important; }
    .goods-table th:nth-child(4) { width: 132px !important; }
    .goods-table th:nth-child(5) { width: 130px !important; }
    .goods-table th:nth-child(6) { width: 108px !important; }
    .goods-table th:nth-child(7) { width: 116px !important; }

    .amount-row td {
        height: 32px;
        padding: 4px 10px;
        font-size: 16px;
    }

    .amount-label { width: 250px; }
    .amount-small { width: 280px; }
    .remark-row td { height: 64px; }

    .remark-content {
        font-size: 14px;
        line-height: 1.42;
    }

    .footer {
        margin-top: 8px;
        padding-left: 56px;
        gap: 54px;
        font-size: 14px;
        line-height: 1.2;
        white-space: nowrap;
        page-break-inside: avoid;
        break-inside: avoid;
    }

    /* 桌面版（html.vbse-desktop 由 Electron preload 注入）打印时恢复文档流排版 */
    html.vbse-desktop .invoice { position: static; }
    html.vbse-desktop .preview-panel { position: static; }
    html.vbse-desktop .seal { top: 25px; left: 50%; }
}

/* ===== 桌面版专属样式（仅 Electron 生效，网页版不含 vbse-desktop 类） ===== */
html.vbse-desktop body {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}

html.vbse-desktop input,
html.vbse-desktop select,
html.vbse-desktop textarea,
html.vbse-desktop button {
    font-family: inherit;
}

/* 发票用 transform 缩放后布局盒仍保持原始尺寸，改为绝对定位，
   占位高度由 updateInvoiceScale 按缩放后高度设定，消除预览面板下方空白 */
html.vbse-desktop .invoice-stage {
    position: relative;
}

html.vbse-desktop .invoice {
    position: absolute;
    top: 0;
    left: 0;
}

/* 监制章对齐标题列中心并下沉到分隔线处，避免压住标题文字 */
html.vbse-desktop .seal {
    top: 58px;
    left: 509px;
}

/* 预览与表单对调：预览在左且滚动时固定在可视区内（sticky），表单在右随页面滚动；
   桌面版始终双栏，表单列压缩（上限 640px）给预览让宽，明细表格过窄时横向滚动 */
html.vbse-desktop .layout {
    grid-template-columns: minmax(480px, 1fr) minmax(500px, 640px);
}

html.vbse-desktop .preview-panel {
    order: -1;
    position: sticky;
    top: 12px;
}

html.vbse-desktop .line-editor {
    overflow-x: auto;
}

/* 购销方名称/税号：选择企业后自动带出即隐藏，仅"手动输入企业"时显示并排一行，
   该区块由 updateCompanyFields 切换 manual-company 类 */
html.vbse-desktop .section:not(.manual-company) .company-manual-field {
    display: none;
}

html.vbse-desktop .section.manual-company .company-manual-field {
    grid-column: auto;
}

html.vbse-desktop .history-delete {
    display: inline-block;
}

html.vbse-desktop .io-btn {
    display: inline-block;
}
</style>
</head>
<body>
<main class="app">
    <header class="topbar">
        <div class="topbar-brand">
            <h1 class="title">VBSE 实训 · 电子发票小程序</h1>
            <span class="teaching-badge">教学样票，不作为真实开票或报销凭证</span>
        </div>
        <div class="actions">
            <button class="ghost io-btn" type="button" onclick="importInvoice()">导入票据</button>
            <button class="ghost io-btn" type="button" onclick="exportInvoice()">导出当前票据</button>
            <button class="print" type="button" onclick="printInvoice()">打印/导出 PDF</button>
        </div>
    </header>

    <div class="layout">
        <section class="panel form-panel">
            <div class="section">
                <h2>基本信息</h2>
                <div class="grid">
                    <div class="field">
                        <label for="invoiceNumber">发票号码</label>
                        <input id="invoiceNumber" class="invoice-number" inputmode="numeric">
                    </div>
                    <div class="field">
                        <label for="invoiceDate">开票日期</label>
                        <input id="invoiceDate" type="date">
                    </div>
                    <div class="field">
                        <label for="drawer">开票人</label>
                        <input id="drawer" value="李明">
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>购买方信息</h2>
                <div class="grid">
                    <div class="field full">
                        <label for="buyerCompany">选择企业</label>
                        <select id="buyerCompany" class="company-select" onchange="applyCompany('buyer')"></select>
                    </div>
                    <div class="field full company-manual-field">
                        <label for="buyerName">名称</label>
                        <input id="buyerName">
                    </div>
                    <div class="field full company-manual-field">
                        <label for="buyerTax">统一社会信用代码/纳税人识别号</label>
                        <input id="buyerTax">
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>销售方信息</h2>
                <div class="grid">
                    <div class="field full">
                        <label for="sellerCompany">选择企业</label>
                        <select id="sellerCompany" class="company-select" onchange="applyCompany('seller')"></select>
                    </div>
                    <div class="field full company-manual-field">
                        <label for="sellerName">名称</label>
                        <input id="sellerName">
                    </div>
                    <div class="field full company-manual-field">
                        <label for="sellerTax">统一社会信用代码/纳税人识别号</label>
                        <input id="sellerTax">
                    </div>
                </div>
            </div>

    const select = byId(`${role}Company`);
    updateCompanyFields(role);
    if (select.value === MANUAL_COMPANY) {
        byId(`${role}Name`).readOnly = false;
        byId(`${role}Tax`).readOnly = false;
        byId(`${role}Name`).focus();
        return;
    }
    const company = COMPANY_OPTIONS[Number(select.value)];
    if (!company) return;
    byId(`${role}Name`).value = company.name;
    byId(`${role}Tax`).value = company.taxId;
    byId(`${role}Name`).readOnly = false;
    byId(`${role}Tax`).readOnly = false;
}

function syncCompanySelect(role, name, taxId) {
    const index = COMPANY_OPTIONS.findIndex(company => company.name === name && company.taxId === taxId);
    byId(`${role}Company`).value = index >= 0 ? String(index) : MANUAL_COMPANY;
    updateCompanyFields(role);
}

function getNextInvoiceNumber() {
    return storage.getItem(STORAGE_NEXT_NUMBER) || DEFAULT_INVOICE_NUMBER;
}

function setNextInvoiceNumber(value) {
    storage.setItem(STORAGE_NEXT_NUMBER, value.toString());
}

function incrementInvoiceNumber(value) {
    const source = /^\d+$/.test(String(value)) ? String(value) : getNextInvoiceNumber();
    const next = incrementDecimalString(source);
    setNextInvoiceNumber(next);
    byId("invoiceNumber").value = next;
}

// 以下数值/格式化函数均为共享核心 VBSECore 的薄适配（见 shared/invoice-core.ts）。
// 待裁决漂移#1：网页版票面为全角 ￥、核心为半角 ¥——formatMoney 仅做显示约定替换。
function incrementDecimalString(value) {
    return VBSECore.incrementDecimalString(value);
}

function formatDateCn(dateValue) {
    return VBSECore.formatDateCn(dateValue);
}

function formatMoney(value, withSymbol) {
    const out = VBSECore.formatMoney(value, withSymbol);
    return withSymbol ? out.replace("¥", "￥") : out;
}

function formatUnitPrice(value) {
    return VBSECore.formatUnitPrice(value);
}

function toChineseUpperMoney(value) {
    return VBSECore.toChineseUpperMoney(value);
}

function toChineseUpperMoney(value) {
    return VBSECore.toChineseUpperMoney(value);
}

function addLineItem(line = {}) {
    const row = document.createElement("div");
    row.className = "line-row";
    row.innerHTML = `
        <input data-label="项目/货物名称" class="line-name" value="${escapeAttr(line.name || "")}" placeholder="项目/货物名称">
        <input data-label="单位" class="line-unit" value="${escapeAttr(line.unit || "份")}" placeholder="单位">
        <input data-label="数量" class="line-qty" type="number" step="0.01" value="${line.qty !== undefined ? line.qty : 1}">
        <input data-label="不含税单价" class="line-price" type="number" step="0.000000000001" value="${line.price !== undefined ? line.price : 0}">
        <div data-label="税率" class="tax-cell">
            <select class="tax-rate-select">
                <option value="0">0%</option>
                <option value="0.06">6%</option>
                <option value="0.09">9%</option>
                <option value="0.13">13%</option>
                <option value="${MANUAL_TAX_RATE}">手动</option>
            </select>
            <input class="tax-manual" type="number" min="0" max="100" step="0.01" placeholder="%" hidden>
        </div>
        <span data-label="金额" class="line-money line-amount">0.00</span>
        <span data-label="税额" class="line-money line-tax-amount">0.00</span>
        <button class="line-delete" type="button" title="删除本行" aria-label="删除本行" onclick="removeLineItem(this)">删</button>
    `;
    byId("lineItems").appendChild(row);
    setTaxControlValue(row, line.taxRate !== undefined ? line.taxRate : 0.13);
    row.querySelectorAll("input, select").forEach(control => {
        control.addEventListener("input", () => updateLineTotals(row));
        control.addEventListener("change", () => updateLineTotals(row));
    });
    row.querySelector(".tax-rate-select").addEventListener("change", () => toggleManualTax(row));
    toggleManualTax(row);
    updateLineTotals(row);
}

function removeLineItem(button) {
    const rows = document.querySelectorAll(".line-row");
    if (rows.length <= 1) {
        showToast("至少保留一行明细");
        return;
    }
    const row = findLineRow(button);
    if (!row) {
        showToast("没有找到要删除的明细行");
        return;
    }
    row.parentNode.removeChild(row);
    refreshPreviewFromForm();
}

function findLineRow(node) {
    while (node && node !== document) {
        if (node.className && String(node.className).split(/\s+/).indexOf("line-row") !== -1) {
            return node;
        }
        node = node.parentNode;
    }
    return null;
}

function refreshPreviewFromForm() {
    const data = collectInvoiceData();
    data.qrPayload = currentInvoiceData && currentInvoiceData.qrPayload;
    renderInvoice(data);
}

function setTaxControlValue(row, taxRate) {
    const select = row.querySelector(".tax-rate-select");
    const manual = row.querySelector(".tax-manual");
    const normalized = Number(taxRate || 0);
    const common = ["0", "0.06", "0.09", "0.13"];
    const match = common.find(value => Math.abs(Number(value) - normalized) < 0.000001);
    if (match !== undefined) {
        select.value = match;
        manual.hidden = true;
        manual.value = "";
    } else {
        select.value = MANUAL_TAX_RATE;
        manual.hidden = false;
        manual.value = formatTaxPercent(normalized);
    }
}

function toggleManualTax(row) {
    const select = row.querySelector(".tax-rate-select");
    const manual = row.querySelector(".tax-manual");
    const isManual = select.value === MANUAL_TAX_RATE;
    manual.hidden = !isManual;
    row.querySelector(".tax-cell").classList.toggle("manual-mode", isManual);
}

function escapeAttr(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function readLineItems() {
    return Array.from(document.querySelectorAll(".line-row")).map(row => {
        const qty = finiteOrZero(row.querySelector(".line-qty").value);
        const price = finiteOrZero(row.querySelector(".line-price").value);
        const taxRate = readTaxRate(row);
        // 舍入口径（漂移 #3 已裁决）：每行先按分舍入再汇总，与核心/小程序一致
        const amount = VBSECore.roundMoney(qty * price);
        const taxAmount = VBSECore.roundMoney(amount * taxRate);
        return {
            name: row.querySelector(".line-name").value.trim(),
            unit: row.querySelector(".line-unit").value.trim(),
            qty,
            price,
            taxRate,
            amount,
            taxAmount
        };
    }).filter(line => line.name || line.qty || line.price);
}

function updateLineTotals(row) {
    toggleManualTax(row);
    const qty = finiteOrZero(row.querySelector(".line-qty").value);
    const price = finiteOrZero(row.querySelector(".line-price").value);
    const taxRate = readTaxRate(row);
    // 行内预览与票面同一舍入口径（每行先舍入再汇总）
    const amount = VBSECore.roundMoney(qty * price);
    const taxAmount = VBSECore.roundMoney(amount * taxRate);
    row.querySelector(".line-amount").textContent = formatMoney(amount);
    row.querySelector(".line-tax-amount").textContent = formatMoney(taxAmount);
}

// 边界加固：非有限数值（NaN/±Infinity/空串转数字除外）一律回落为 0，
// 正常输入行为不变，异常输入（如 1e999）不再产生 Infinity 传染到金额计算
function finiteOrZero(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
}

function readTaxRate(row) {
    const select = row.querySelector(".tax-rate-select");
    if (select.value === MANUAL_TAX_RATE) {
        return finiteOrZero(row.querySelector(".tax-manual").value) / 100;
    }
    return finiteOrZero(select.value);
}

function formatTaxPercent(rate) {
    return VBSECore.formatTaxPercent(rate);
}

function collectInvoiceData() {
    const lines = readLineItems();
    const totalAmount = lines.reduce((sum, line) => sum + line.amount, 0);
    const totalTax = lines.reduce((sum, line) => sum + line.taxAmount, 0);
    const grandTotal = totalAmount + totalTax;
    return {
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        savedAt: new Date().toISOString(),
        invoiceNumber: byId("invoiceNumber").value.trim() || getNextInvoiceNumber(),
        invoiceDate: byId("invoiceDate").value,
        buyerName: byId("buyerName").value.trim(),
        buyerTax: byId("buyerTax").value.trim(),
        sellerName: byId("sellerName").value.trim(),
        sellerTax: byId("sellerTax").value.trim(),
        drawer: byId("drawer").value.trim(),
        remark: byId("remarkInput").value.trim(),
        lines,
        totalAmount,
        totalTax,
        grandTotal,
        qrPayload: currentInvoiceData && currentInvoiceData.qrPayload
    };
}

function validateInvoice(data) {
    if (!data.invoiceDate) return "请选择开票日期";
    if (!data.buyerName || !data.buyerTax) return "请选择或填写购买方名称和税号";
    if (!data.sellerName || !data.sellerTax) return "请选择或填写销售方名称和税号";
    if (data.lines.length === 0) return "请至少填写一行项目明细";
    if (data.lines.some(line => !line.name)) return "项目明细的名称不能为空";
    if (data.lines.some(line => line.qty <= 0 || line.price < 0)) return "数量必须大于 0，不含税单价不能为负数";
    if (data.lines.some(line => line.taxRate < 0 || line.taxRate > 1)) return "税率请输入 0 到 100 之间的百分比";
    return "";
}

function ensureQrPayload(data, forceNew) {
    return VBSECore.ensureQrPayload(data, forceNew);
}

function renderInvoice(data) {
    data.qrPayload = ensureQrPayload(data, false);
    currentInvoiceData = data;
    byId("pInvoiceNumber").textContent = data.invoiceNumber;
    byId("pInvoiceDate").textContent = formatDateCn(data.invoiceDate);
    byId("pBuyerName").textContent = data.buyerName;
    byId("pBuyerTax").textContent = data.buyerTax;
    byId("pSellerName").textContent = data.sellerName;
    byId("pSellerTax").textContent = data.sellerTax;
    byId("pTotalAmount").textContent = formatMoney(data.totalAmount, true);
    byId("pTotalTax").textContent = formatMoney(data.totalTax, true);
    byId("pUpperAmount").textContent = toChineseUpperMoney(data.grandTotal);
    byId("pGrandTotal").textContent = formatMoney(data.grandTotal, true);
    byId("pRemark").textContent = data.remark || " ";
    byId("pDrawer").textContent = data.drawer;
    drawQrCode("pQrCanvas", data.qrPayload);

    const body = byId("pGoodsBody");
    body.innerHTML = "";
    const displayLines = data.lines;
    displayLines.forEach(line => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${escapeHtml(line.name)}</td>
            <td style="text-align:center;">${escapeHtml(line.unit)}</td>
            <td class="num">${line.qty}</td>
            <td class="num">${formatUnitPrice(line.price)}</td>
            <td class="num">${formatMoney(line.amount)}</td>
            <td style="text-align:center;">${formatTaxPercent(line.taxRate)}%</td>
            <td class="num">${formatMoney(line.taxAmount)}</td>
        `;
        body.appendChild(tr);
    });
    for (let i = displayLines.length; i < Math.max(8, displayLines.length); i++) {
        const empty = document.createElement("tr");
        empty.innerHTML = "<td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td>";
        body.appendChild(empty);
    }
    updateInvoiceScale();
}

function escapeHtml(value) {
    return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function createInvoice() {
    const data = collectInvoiceData();
    const error = validateInvoice(data);
    if (error) {
        showToast(error);
        return;
    }
    data.qrPayload = ensureQrPayload(data, true);
    renderInvoice(data);
    saveHistory(data);
    incrementInvoiceNumber(data.invoiceNumber);
    renderHistory();
    showToast(`已生成并保存发票 ${data.invoiceNumber}`);
}

function saveHistory(data) {
    const history = getHistory();
    history.unshift(data);
    storage.setItem(STORAGE_HISTORY, JSON.stringify(history.slice(0, 100)));
}

function getHistory() {
    try {
        return JSON.parse(storage.getItem(STORAGE_HISTORY) || "[]");
    } catch (error) {
        return [];
    }
}

function normalizeHistoryItem(item) {
    item.lines = (item.lines || []).map(line => ({
        name: line.name || "",
        unit: line.unit || "份",
        qty: finiteOrZero(line.qty),
        price: finiteOrZero(line.price),
        taxRate: finiteOrZero(line.taxRate),
        amount: finiteOrZero(line.amount),
        taxAmount: finiteOrZero(line.taxAmount)
    }));
    item.totalAmount = item.lines.reduce((sum, line) => sum + line.amount, 0);
    item.totalTax = item.lines.reduce((sum, line) => sum + line.taxAmount, 0);
    item.grandTotal = item.totalAmount + item.totalTax;
    item.qrPayload = ensureQrPayload(item, false);
    return item;
}

function renderHistory() {
    const list = byId("historyList");
    const history = getHistory();
    list.innerHTML = "";
    if (history.length === 0) {
        list.innerHTML = '<div class="history-empty">还没有历史记录，生成发票后会自动保存到这里。</div>';
        return;
    }
    history.forEach(item => {
        item = normalizeHistoryItem(item);
        const card = document.createElement("div");
        card.className = "history-card";
        card.innerHTML = `
            <div class="history-main">
                <strong>发票号码：${escapeHtml(item.invoiceNumber)}</strong>
                <span>日期：${escapeHtml(formatDateCn(item.invoiceDate))}</span>
                <span>购方：${escapeHtml(item.buyerName)}</span>
                <span>销方：${escapeHtml(item.sellerName)}</span>
                <span>价税合计：${escapeHtml(formatMoney(item.grandTotal, true))}</span>
            </div>
            <div class="history-actions">
                <button class="ghost" type="button" onclick="loadHistory('${item.id}')">查看/载入</button>
                <button class="print" type="button" onclick="printHistory('${item.id}')">打印</button>
                <button class="danger history-delete" type="button" onclick="deleteHistory('${item.id}')">删除</button>
            </div>
        `;
        list.appendChild(card);
    });
}

function loadHistory(id) {
    const item = getHistory().find(entry => entry.id === id);
    if (!item) return;
    const normalized = normalizeHistoryItem(item);
    fillForm(normalized);
    renderInvoice(normalized);
    showToast(`已载入历史发票 ${normalized.invoiceNumber}`);
}

function printHistory(id) {
    const item = getHistory().find(entry => entry.id === id);
    if (!item) return;
    renderInvoice(normalizeHistoryItem(item));
    printInvoice();
}

function clearHistory() {
    if (!confirm("确定清空本浏览器里的全部历史记录吗？")) return;
    storage.removeItem(STORAGE_HISTORY);
    renderHistory();
    showToast("历史记录已清空");
}

// 单条删除：按钮由桌面版 CSS 控制显示（网页版 .history-delete 隐藏，行为不变）
function deleteHistory(id) {
    if (!confirm("确定删除这条历史记录吗？")) return;
    const history = getHistory().filter(entry => entry.id !== id);
    storage.setItem(STORAGE_HISTORY, JSON.stringify(history));

function fillForm(data) {

    byId("invoiceDate").value = data.invoiceDate || today();
    byId("buyerName").value = data.buyerName || "";
    byId("buyerTax").value = data.buyerTax || "";
    byId("sellerName").value = data.sellerName || "";
    byId("sellerTax").value = data.sellerTax || "";
    byId("drawer").value = data.drawer || "";
    byId("remarkInput").value = data.remark || "";

function fillSample() {

        sellerName: COMPANY_OPTIONS[0].name,

        drawer: "李明",
        remark: "购方开户银行：--;    银行账号：--;\n销方开户银行：--;    银行账号：--",

    });

function printInvoice() {

// 导出/导入票据 JSON（教学材料流转）：文件读写只在主进程完成（vbseIO 桥），
// 页面只传/收一段 JSON 字符串；网页版无 vbseIO 且按钮隐藏，行为不变
function exportInvoice() {
    if (!window.vbseIO) {
        showToast("网页版暂不支持导出，请使用桌面版");
        return;
    }
    const data = collectInvoiceData();
    const error = validateInvoice(data);
    if (error) {
        showToast(error);
        return;
    }
    data.qrPayload = ensureQrPayload(data, false);
    window.vbseIO.exportInvoice(JSON.stringify(data, null, 2), `VBSE票据-${data.invoiceNumber}.json`)
        .then(ret => {
            if (ret && ret.ok) showToast(`已导出票据到 ${ret.path}`);
            else if (ret && !ret.canceled) showToast(`导出失败：${ret.error || "未知错误"}`);
        })
        .catch(() => showToast("导出失败"));
}

// 导入 JSON 严格校验：只放行形状与数值边界都合法的票据，任何不合法整体拒绝。
// 本工具导出的合法数据行为与此前完全一致；返回空串表示通过，否则为拒绝原因。
function validateImportedInvoice(record) {
    if (!record || typeof record !== "object" || Array.isArray(record)) return "票据数据必须是对象";
    if (typeof record.invoiceNumber !== "string" || !record.invoiceNumber.trim() || record.invoiceNumber.length > 32) return "发票号码缺失或超长";
    if (typeof record.invoiceDate !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(record.invoiceDate)) return "开票日期格式应为 YYYY-MM-DD";
    const parsedDate = new Date(record.invoiceDate + "T00:00:00Z");
    if (Number.isNaN(parsedDate.getTime()) || parsedDate.toISOString().slice(0, 10) !== record.invoiceDate) return "开票日期不是有效日期";
    for (const [key, max] of [["buyerName", 100], ["buyerTax", 64], ["sellerName", 100], ["sellerTax", 64]]) {
        const value = record[key];
        if (typeof value !== "string" || !value.trim() || value.length > max) return "购销方名称/税号缺失或超长";
    }
    if (record.drawer !== undefined && (typeof record.drawer !== "string" || record.drawer.length > 50)) return "开票人字段不合法";
    if (record.remark !== undefined && (typeof record.remark !== "string" || record.remark.length > 500)) return "备注字段不合法";
    if (record.id !== undefined && (typeof record.id !== "string" || record.id.length > 64)) return "记录 id 不合法";
    if (!Array.isArray(record.lines) || record.lines.length < 1 || record.lines.length > 200) return "项目明细必须为 1~200 行";
    for (let i = 0; i < record.lines.length; i++) {
        const line = record.lines[i];
        if (!line || typeof line !== "object" || Array.isArray(line)) return `第 ${i + 1} 行明细必须是对象`;
        if (typeof line.name !== "string" || !line.name.trim() || line.name.length > 200) return `第 ${i + 1} 行名称缺失或超长`;
        if (typeof line.unit !== "string" || line.unit.length > 20) return `第 ${i + 1} 行单位不合法`;
        if (!Number.isFinite(line.qty) || line.qty <= 0 || line.qty > 1e9) return `第 ${i + 1} 行数量必须是大于 0 且不超过 10 亿的有限数字`;
        if (!Number.isFinite(line.price) || line.price < 0 || line.price > 1e9) return `第 ${i + 1} 行单价必须是 0 到 10 亿之间的有限数字`;
        if (!Number.isFinite(line.taxRate) || line.taxRate < 0 || line.taxRate > 1) return `第 ${i + 1} 行税率必须在 0~100% 之间`;
        if (!Number.isFinite(line.amount) || line.amount < 0 || line.amount > 1e12) return `第 ${i + 1} 行金额必须是 0 到 1 万亿之间的有限数字`;
        if (!Number.isFinite(line.taxAmount) || line.taxAmount < 0 || line.taxAmount > 1e12) return `第 ${i + 1} 行税额必须是 0 到 1 万亿之间的有限数字`;
    }
    // 业务一致性：字段各自合法还不够，金额必须与数量×单价、税额与金额×税率、汇总与明细和互相自洽。
    // 比较复用 formatMoney 的分位舍入语义（与票面展示同一套规则），不引入第三套金额算法；
    // 本工具导出的文件按构造自洽，必然通过。汇总三字段由导出方固定携带，故必填。
    for (const key of ["totalAmount", "totalTax", "grandTotal"]) {
        if (!Number.isFinite(record[key]) || record[key] < 0) return `缺少${key === "totalAmount" ? "合计金额" : key === "totalTax" ? "税额合计" : "价税合计"}或数值不合法`;
    }
    const totalAmount = record.lines.reduce((sum, line) => sum + line.amount, 0);
    const totalTax = record.lines.reduce((sum, line) => sum + line.taxAmount, 0);
    if (formatMoney(record.totalAmount) !== formatMoney(totalAmount)) return "合计金额与明细汇总不一致";
    if (formatMoney(record.totalTax) !== formatMoney(totalTax)) return "税额合计与明细汇总不一致";
    if (formatMoney(record.grandTotal) !== formatMoney(record.totalAmount + record.totalTax)) return "价税合计与合计、税额之和不一致";
    for (let i = 0; i < record.lines.length; i++) {
        const line = record.lines[i];
        if (formatMoney(line.amount) !== formatMoney(line.qty * line.price)) return `第 ${i + 1} 行金额与数量×单价不一致`;
        if (formatMoney(line.taxAmount) !== formatMoney(line.amount * line.taxRate)) return `第 ${i + 1} 行税额与金额×税率不一致`;
    }
    return "";
}

// 顺序契约（不得调整）：JSON.parse → validateImportedInvoice(原始对象) → normalizeHistoryItem → 应用。
// 校验必须发生在 normalize 之前：normalizeHistoryItem 的 finiteOrZero 是历史数据容错路径，
// 会把非法值洗成 0——若先 normalize 再校验，等于拆掉导入的严格边界。
function importInvoice() {
    if (!window.vbseIO) {
        showToast("网页版暂不支持导入，请使用桌面版");
        return Promise.resolve({ ok: false, error: "网页版暂不支持导入" });
    }
    return window.vbseIO.importInvoice()
        .then(ret => {
            if (!ret || !ret.ok) {
                if (ret && !ret.canceled) showToast(`导入失败：${ret.error || "未知错误"}`);
                return { ok: false, error: ret && ret.error };
            }
            let record;
            try {
                record = JSON.parse(ret.json);
            } catch (_) {
                showToast("文件不是有效的票据 JSON");
                return { ok: false, error: "文件不是有效的票据 JSON" };
            }
            const problem = validateImportedInvoice(record);
            if (problem) {
                showToast(`导入已拒绝：${problem}`);
                return { ok: false, error: problem };
            }
            const normalized = normalizeHistoryItem(record);
            fillForm(normalized);
            renderInvoice(normalized);
            showToast(`已导入票据 ${normalized.invoiceNumber}，核对后点"生成发票"保存`);
            return { ok: true };
        })
        .catch(() => {
            showToast("导入失败");
            return { ok: false, error: "导入失败" };
        });
}

function today() {
    return VBSECore.todayString();
}

function boot() {
    populateCompanySelects();
    byId("invoiceDate").value = today();
    byId("invoiceNumber").value = getNextInvoiceNumber();
    fillSample();
    renderHistory();
    updateInvoiceScale();
    // 桌面版 preload 在 DOMContentLoaded 才注入 vbse-desktop 标识类（此时 boot 已执行完），
    // 监听同事件在其后重算一次缩放；网页版无该类，重算结果不变
    document.addEventListener("DOMContentLoaded", updateInvoiceScale);
}

function updateInvoiceScale() {
    const panel = byId("previewPanel");
    const stage = byId("invoiceStage");
    const invoice = byId("invoice");
    if (!panel || !stage || !invoice) return;
    // 桌面版发票绝对定位后以面板内容区左缘为原点，可用宽度需扣除 .preview-panel
    // 左右内边距（16px × 2），否则缩放后右缘溢出被裁；网页版保持原有算法不变。
    // 桌面版下限放宽到 0.28：窄窗口双栏时发票按列宽缩小而不是被裁剪
    const desktopMode = document.documentElement.classList.contains("vbse-desktop");
    const availableWidth = panel.clientWidth - (desktopMode ? 32 : 0);
    const minScale = desktopMode ? 0.28 : 0.45;
    const invoiceWidth = 1180;
    const scale = Math.min(1, Math.max(minScale, availableWidth / invoiceWidth));
    stage.style.setProperty("--invoice-scale", scale.toFixed(4));
    stage.style.minHeight = `${invoice.offsetHeight * scale}px`;
}

function drawQrCode(canvasId, text) {
    const canvas = byId(canvasId);
    const matrix = makeQrMatrix(text || "VBSE");
    const quiet = 4;
    const modules = matrix.length + quiet * 2;
    const scale = Math.floor(canvas.width / modules);
    const size = modules * scale;
    const offset = Math.floor((canvas.width - size) / 2);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000";
    for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix.length; x++) {
            if (matrix[y][x]) {
                ctx.fillRect(offset + (x + quiet) * scale, offset + (y + quiet) * scale, scale, scale);
            }
        }
    }
}

function makeQrMatrix(text) {
    const version = 4;
    const size = 33;
    const dataCodewords = 80;
    const eccCodewords = 20;
    const bytes = asciiBytes(text).slice(0, 62);
    const bits = [];
    appendBits(bits, 0x4, 4);
    appendBits(bits, bytes.length, 8);
    bytes.forEach(byte => appendBits(bits, byte, 8));
    const capacityBits = dataCodewords * 8;
    appendBits(bits, 0, Math.min(4, capacityBits - bits.length));
    while (bits.length % 8) bits.push(0);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
        data.push(bitsToByte(bits.slice(i, i + 8)));
    }
    for (let pad = 0xec; data.length < dataCodewords; pad = pad === 0xec ? 0x11 : 0xec) {
        data.push(pad);
    }
    const ecc = reedSolomonRemainder(data, eccCodewords);
    const codewords = data.concat(ecc);
    const matrix = Array.from({ length: size }, () => Array(size).fill(false));
    const reserved = Array.from({ length: size }, () => Array(size).fill(false));
    drawFinder(matrix, reserved, 0, 0);
    drawFinder(matrix, reserved, size - 7, 0);
    drawFinder(matrix, reserved, 0, size - 7);
    drawTiming(matrix, reserved, size);
    drawAlignment(matrix, reserved, 26, 26);
    reserveFormat(reserved, size);
    matrix[4 * version + 9][8] = true;
    reserved[4 * version + 9][8] = true;
    placeData(matrix, reserved, codewords, size);
    drawFormatBits(matrix, reserved, size, 1, 0);
    return matrix;
}

function asciiBytes(text) {
    const safe = String(text).replace(/[^\x20-\x7e]/g, "?");
    return Array.from(safe).map(ch => ch.charCodeAt(0));
}

function appendBits(bits, value, length) {
    for (let i = length - 1; i >= 0; i--) bits.push((value >>> i) & 1);
}

function bitsToByte(bits) {
    return bits.reduce((value, bit) => (value << 1) | bit, 0);
}

function drawFinder(matrix, reserved, x, y) {
    for (let dy = -1; dy <= 7; dy++) {
        for (let dx = -1; dx <= 7; dx++) {
            const xx = x + dx;
            const yy = y + dy;
            if (xx < 0 || yy < 0 || xx >= matrix.length || yy >= matrix.length) continue;
            const on = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6 &&
                (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
            matrix[yy][xx] = on;
            reserved[yy][xx] = true;
        }
    }
}

function drawTiming(matrix, reserved, size) {
    for (let i = 8; i < size - 8; i++) {
        const on = i % 2 === 0;
        matrix[6][i] = on;
        matrix[i][6] = on;
        reserved[6][i] = true;
        reserved[i][6] = true;
    }
}

function drawAlignment(matrix, reserved, cx, cy) {
    for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
            const dist = Math.max(Math.abs(dx), Math.abs(dy));
            matrix[cy + dy][cx + dx] = dist !== 1;
            reserved[cy + dy][cx + dx] = true;
        }
    }
}

function reserveFormat(reserved, size) {
    for (let i = 0; i < 9; i++) {
        reserved[8][i] = true;
        reserved[i][8] = true;
    }
    for (let i = 0; i < 8; i++) {
        reserved[8][size - 1 - i] = true;
        reserved[size - 1 - i][8] = true;
    }
}

function placeData(matrix, reserved, codewords, size) {
    const bits = [];
    codewords.forEach(byte => appendBits(bits, byte, 8));
    let bitIndex = 0;
    let upward = true;
    for (let x = size - 1; x > 0; x -= 2) {
        if (x === 6) x--;
        for (let yStep = 0; yStep < size; yStep++) {
            const y = upward ? size - 1 - yStep : yStep;
            for (let dx = 0; dx < 2; dx++) {
                const xx = x - dx;
                if (reserved[y][xx]) continue;
                let bit = bitIndex < bits.length ? bits[bitIndex++] : 0;
                if ((xx + y) % 2 === 0) bit ^= 1;
                matrix[y][xx] = bit === 1;
            }
        }
        upward = !upward;
    }
}

function drawFormatBits(matrix, reserved, size, eccLevel, mask) {
    const bits = getFormatBits((eccLevel << 3) | mask);
    for (let i = 0; i <= 5; i++) matrix[8][i] = ((bits >> i) & 1) !== 0;
    matrix[8][7] = ((bits >> 6) & 1) !== 0;
    matrix[8][8] = ((bits >> 7) & 1) !== 0;
    matrix[7][8] = ((bits >> 8) & 1) !== 0;
    for (let i = 9; i < 15; i++) matrix[14 - i][8] = ((bits >> i) & 1) !== 0;
    for (let i = 0; i < 8; i++) matrix[size - 1 - i][8] = ((bits >> i) & 1) !== 0;
    for (let i = 8; i < 15; i++) matrix[8][size - 15 + i] = ((bits >> i) & 1) !== 0;
}

function getFormatBits(data) {
    let value = data << 10;
    const generator = 0x537;
    for (let i = 14; i >= 10; i--) {
        if (((value >> i) & 1) !== 0) value ^= generator << (i - 10);
    }
    return ((data << 10) | value) ^ 0x5412;
}

function reedSolomonRemainder(data, degree) {
    const generator = reedSolomonGenerator(degree);
    const result = Array(degree).fill(0);
    data.forEach(byte => {
        const factor = byte ^ result.shift();
        result.push(0);
        for (let i = 0; i < degree; i++) {
            result[i] ^= gfMultiply(generator[i], factor);
        }
    });
    return result;
}

function reedSolomonGenerator(degree) {
    let result = [1];
    for (let i = 0; i < degree; i++) {
        const next = Array(result.length + 1).fill(0);
        for (let j = 0; j < result.length; j++) {
            next[j] ^= gfMultiply(result[j], 1);
            next[j + 1] ^= gfMultiply(result[j], gfPow(2, i));
        }
        result = next;
    }
    return result.slice(1);
}

function gfPow(x, power) {
    let result = 1;
    for (let i = 0; i < power; i++) result = gfMultiply(result, x);
    return result;
}

function gfMultiply(x, y) {
    let result = 0;
    while (y > 0) {
        if (y & 1) result ^= x;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
        y >>= 1;
    }
    return result;
}

window.addEventListener("resize", updateInvoiceScale);
boot();
</script>
</body>
</html>
